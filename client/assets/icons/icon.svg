<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131A26"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Borda sutil de destaque -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#ring-grad)" stroke-width="6" stroke-opacity="0.4"/>
  
  <!-- Círculo de Energia / Bateria -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1E293B" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring-grad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="750 255" transform="rotate(-90 256 256)"/>
  
  <!-- Raio kWhub -->
  <path d="M280 96 L156 272 L260 272 L232 416 L356 240 L252 240 Z" fill="url(#bolt-grad)" filter="url(#glow)"/>
</svg>
